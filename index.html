<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fatou — Développeuse Web</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Instrument+Serif:ital@0;1&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0A0A14] text-[#F0EFF4] font-sora antialiased overflow-x-hidden selection:bg-[#7B61FF] selection:text-white">
    <div id="root"></div>
    <!-- Noise overlay -->
    <svg class="pointer-events-none fixed inset-0 z-50 h-full w-full opacity-5">
      <filter id="noise">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noise)" />
    </svg>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
